[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
