[provider]
base_url = "http://127.0.0.1:1234/v1"
model = "replace-with-an-id-from-aether-models"
api_key_env = "AETHER_API_KEY"
allow_remote = false
timeout_secs = 180

[agent]
mode = "ask"
max_steps = 20
context_tokens = 32768
output_tokens = 4096
timeout_secs = 600

[permissions]
read = "ask"
write = "ask"
shell = "ask"
